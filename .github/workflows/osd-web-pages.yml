name: OSD Web Edition — verify and deploy
on:
  pull_request:
    branches: [main]
    paths: ["web/**", "tests/test_web_static.py", "tests/web_browser_smoke.mjs", "tests/web_video_export_e2e.mjs", ".github/workflows/osd-web-pages.yml", "tests/web_real_model_inference.mjs"]
  push:
    branches: [main]
    paths: ["web/**", "tests/test_web_static.py", "tests/web_browser_smoke.mjs", ".github/workflows/osd-web-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osd-web-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run web static safety tests
        run: python tests/test_web_static.py -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/osd-web-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/osd-web-inline.js

      - name: Install browser smoke-test dependencies
        run: npm install --no-save playwright

      - name: Install Chromium for runtime smoke test
        run: npx playwright install --with-deps chromium

      - name: Serve the exact web source
        run: |
          python -m http.server 4173 --directory . > /tmp/osd-web-server.log 2>&1 &
          echo $! > /tmp/osd-web-server.pid
          python - <<'PY'
          import time
          import urllib.request
          url = "http://127.0.0.1:4173/web/index.html"
          for _ in range(50):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          print("Local web server ready")
                          break
              except Exception:
                  time.sleep(0.2)
          else:
              raise SystemExit("Local web server did not become ready")
          PY

      - name: Run Chromium audio import, render, QC and project smoke test
        run: node tests/web_browser_smoke.mjs

      - name: Run real-media video plus mix export end-to-end test
        run: node tests/web_video_export_e2e.mjs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload web application
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy web application
        id: deployment
        uses: actions/deploy-pages@v4

  real-model-inference:
    # Deliberately opt-in: real model downloads depend on external hosting and can
    # be slow or memory-intensive. Normal PR CI remains deterministic.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout selected branch or ref
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve exact OSD web source
        run: |
          python3 -m http.server 4173 --directory . > /tmp/osd-real-model-server.log 2>&1 &
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:4173/web/index.html", timeout=1) as response:
                      if response.status == 200:
                          print("OSD local server ready")
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("OSD local server did not become ready")
          PY
      - name: Run actual browser-local MobileNet inference
        run: node tests/web_real_model_inference.mjs
