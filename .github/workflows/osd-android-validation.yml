name: OSD Android APK validation

on:
  push:
    branches:
      - main
      - "ops/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osd-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Python for regression tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run available Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d app/src/test/python ]]; then
            python -m unittest discover -s app/src/test/python -p 'test*.py' -v
          elif [[ -d tests ]]; then
            python -m unittest discover -s tests -p 'test*.py' -v
          else
            echo "::warning::No recognized Python test directory exists in this checkout."
          fi

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and record provenance
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release-evidence
          cp "$APK" release-evidence/OSD-1.20.0-debug.apk
          sha256sum release-evidence/OSD-1.20.0-debug.apk > release-evidence/SHA256SUMS.txt
          {
            echo "osd_version=1.20.0"
            echo "source_commit=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "apk_bytes=$(wc -c < release-evidence/OSD-1.20.0-debug.apk | tr -d ' ')"
            echo "device_runtime_tested=false"
          } > release-evidence/BUILD-METADATA.txt
          git archive --format=tar.gz --output=release-evidence/OSD-source-$GITHUB_SHA.tar.gz "$GITHUB_SHA"
          sha256sum release-evidence/OSD-source-$GITHUB_SHA.tar.gz >> release-evidence/SHA256SUMS.txt

      - name: Upload APK and source evidence
        uses: actions/upload-artifact@v4
        with:
          name: osd-1.20.0-build-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
