name: Build OSD Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk | tee app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OSD-1.20.0-Android
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256